pan style=\"display:inline-block; opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .15s forwards\">You<\u002Fspan>\n          <span style=\"display:inline-block; opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .22s forwards\">don't<\u002Fspan>\n          <span style=\"display:inline-block; opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .29s forwards\">have<\u002Fspan>\n          <span style=\"display:inline-block; opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .36s forwards\">to<\u002Fspan>\n          <span style=\"display:inline-block; opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .43s forwards\">keep<\u002Fspan>\n          <span style=\"display:inline-block; opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .5s forwards\">carrying<\u002Fspan><br>\n          <span style=\"display:inline-block; opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .6s forwards\">what<\u002Fspan>\n          <span style=\"display:inline-block; opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .67s forwards\">happened<\u002Fspan>\n          <span style=\"display:inline-block; opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .74s forwards\">to<\u002Fspan>\n          <span style=\"display:inline-block; opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) .81s forwards; font-style:italic; color:#D15AA3\">you.<\u002Fspan>\n        <\u002Fh1>\n        <p style=\"margin:0 0 36px; max-width:560px; font-size:18px; line-height:1.65; opacity:0; animation:rise 1s 1s forwards\">You're successful on the outside and exhausted on the inside. I help high-achieving women heal childhood and complex trauma — not by talking about it again, but by working with the nervous system that's still holding it.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:18px 24px; opacity:0; animation:rise 1s 1.2s forwards\">\n          <a href=\"#contact\" style=\"display:inline-flex; align-items:center; padding:16px 28px; border-radius:999px; background:#D15AA3; color:#fff; font-weight:700; font-size:16px; transition:background .3s, transform .3s\" style-hover=\"background:#92205C; color:#fff; transform:translateY(-1px)\">Book a free 15-minute consultation<\u002Fa>\n          <span style=\"font-size:15px; color:#6A696F\">No pressure. Just a conversation.<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:48px 0 0; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#A7A7A6; line-height:1.9; opacity:0; animation:fadein 1s 1.5s forwards\">Licensed Clinical Mental Health Counselor · Certified IFS Therapist · International Integral Sound Healing Practitioner<\u002Fp>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showPortrait }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:relative; justify-self:center; width:min(100%,440px); opacity:0; animation:fadein 1.4s .6s forwards\">\n          <div style=\"position:absolute; inset:24px -24px -24px 24px; border-radius:28px; background:#FBEAF3\"><\u002Fdiv>\n          <div style=\"position:relative; aspect-ratio:4/5; border-radius:24px; overflow:hidden; box-shadow:0 2px 12px rgba(146,32,92,.10)\">\n            <image-slot id=\"hero-portrait\" shape=\"rect\" placeholder=\"Portrait of Elyce — warm, natural light, looking at camera\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 IF THIS SOUNDS LIKE YOU -->\n  <section data-screen-label=\"02 If this sounds like you\" style=\"padding:clamp(80px,12vh,140px) clamp(20px,5vw,64px); background:#FBEAF3\">\n    <div style=\"max-width:880px; margin:0 auto; text-align:center\">\n      <p data-reveal=\"\" style=\"margin:0 0 20px; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#D15AA3\">If this sounds like you<\u002Fp>\n      <h2 data-reveal=\"\" style=\"margin:0 auto 56px; max-width:720px; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,3.6vw,46px); line-height:1.15; color:#92205C\">You're successful, capable, and high-achieving on the outside. But inside, you feel:<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); gap:20px; text-align:left\">\n        <div data-reveal=\"\" data-delay=\"0\" style=\"display:flex; flex-direction:column; gap:18px; padding:30px 28px; background:#fff; border-radius:22px; box-shadow:0 2px 10px rgba(146,32,92,.08)\">\n          <span style=\"width:56px; height:56px; border-radius:50%; background:#D15AA3; display:inline-flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 6px 16px #D15AA355\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12 L6 12 L8.5 5 L12 19 L15.5 9 L17.5 12 L22 12\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <p style=\"margin:0; font-size:17px; line-height:1.45; color:#92205C\"><strong style=\"font-weight:700\">Constantly anxious<\u002Fstrong>, even when there's no real threat<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"90\" style=\"display:flex; flex-direction:column; gap:18px; padding:30px 28px; background:#fff; border-radius:22px; box-shadow:0 2px 10px rgba(146,32,92,.08)\">\n          <span style=\"width:56px; height:56px; border-radius:50%; background:#605490; display:inline-flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 6px 16px #60549055\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M8 15.5 C9.2 14.6 10.6 14.2 12 14.2 C13.4 14.2 14.8 14.6 16 15.5\" transform=\"rotate(180 12 14.8)\"><\u002Fpath><line x1=\"9\" y1=\"9.5\" x2=\"9.01\" y2=\"9.5\"><\u002Fline><line x1=\"15\" y1=\"9.5\" x2=\"15.01\" y2=\"9.5\"><\u002Fline><\u002Fsvg>\n          <\u002Fspan>\n          <p style=\"margin:0; font-size:17px; line-height:1.45; color:#92205C\"><strong style=\"font-weight:700\">Disconnected from joy<\u002Fstrong>, even during moments that should feel good<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"180\" style=\"display:flex; flex-direction:column; gap:18px; padding:30px 28px; background:#fff; border-radius:22px; box-shadow:0 2px 10px rgba(146,32,92,.08)\">\n          <span style=\"width:56px; height:56px; border-radius:50%; background:#AA2167; display:inline-flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 6px 16px #AA216755\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 L5 14 L12 14 L11 22 L19 10 L12 10 Z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <p style=\"margin:0; font-size:17px; line-height:1.45; color:#92205C\"><strong style=\"font-weight:700\">Triggered<\u002Fstrong> by situations that remind you of your past<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"270\" style=\"display:flex; flex-direction:column; gap:18px; padding:30px 28px; background:#fff; border-radius:22px; box-shadow:0 2px 10px rgba(146,32,92,.08)\">\n          <span style=\"width:56px; height:56px; border-radius:50%; background:#B13A72; display:inline-flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 6px 16px #B13A7255\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 12 A8 8 0 1 1 17.7 6.3\"><\u002Fpath><polyline points=\"18 2 18 6.5 13.5 6.5\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fspan>\n          <p style=\"margin:0; font-size:17px; line-height:1.45; color:#92205C\"><strong style=\"font-weight:700\">Stuck in patterns<\u002Fstrong> you know aren't serving you, but can't seem to change<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"360\" style=\"display:flex; flex-direction:column; gap:18px; padding:30px 28px; background:#fff; border-radius:22px; box-shadow:0 2px 10px rgba(146,32,92,.08)\">\n          <span style=\"width:56px; height:56px; border-radius:50%; background:#92205C; display:inline-flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 6px 16px #92205C55\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12 C5 6.5 8.5 4.5 12 4.5 C15.5 4.5 19 6.5 22 12 C19 17.5 15.5 19.5 12 19.5 C8.5 19.5 5 17.5 2 12 Z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fspan>\n          <p style=\"margin:0; font-size:17px; line-height:1.45; color:#92205C\"><strong style=\"font-weight:700\">On high alert<\u002Fstrong>, scanning for danger, unable to truly relax<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"450\" style=\"display:flex; flex-direction:column; gap:18px; padding:30px 28px; background:#fff; border-radius:22px; box-shadow:0 2px 10px rgba(146,32,92,.08)\">\n          <span style=\"width:56px; height:56px; border-radius:50%; background:#793A75; display:inline-flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 6px 16px #793A7555\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 20 L21 20\"><\u002Fpath><path d=\"M6 20 L6 12 L18 12 L18 20\"><\u002Fpath><path d=\"M9 12 L9 8 L15 8 L15 12\"><\u002Fpath><path d=\"M11 8 L11 5 L13 5 L13 8\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <p style=\"margin:0; font-size:17px; line-height:1.45; color:#92205C\"><strong style=\"font-weight:700\">Exhausted<\u002Fstrong> from carrying the weight of your past while trying to move forward<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p data-reveal=\"\" data-delay=\"600\" style=\"margin:56px auto 0; max-width:520px; font-family:'Fraunces',serif; font-style:italic; font-size:22px; line-height:1.4; color:#AA2167\">If you recognised yourself in that list, you're in the right place.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 WHY TALK THERAPY HASN'T WORKED — berry divider -->\n  <section data-screen-label=\"03 Why talk therapy hasn't worked\" style=\"position:relative; background:#92205C; color:#fff; padding:clamp(100px,16vh,180px) clamp(20px,5vw,64px); overflow:hidden\">\n    <div aria-hidden=\"true\" style=\"position:absolute; inset:0; background:radial-gradient(circle at 85% 90%, rgba(255,255,255,.18) 0%, rgba(255,255,255,.06) 35%, rgba(255,255,255,0) 65%); pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative; max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:clamp(40px,6vw,88px); align-items:center\">\n      <div>\n        <p data-reveal=\"\" style=\"margin:0 0 24px; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#F7C6E2\">Why talk therapy hasn't worked<\u002Fp>\n        <h2 data-reveal=\"\" style=\"margin:0 0 32px; font-family:'Fraunces',serif; font-weight:500; font-size:clamp(36px,4.6vw,58px); line-height:1.08; letter-spacing:-.01em; color:#fff\">You've done the work. So why doesn't it feel any different?<\u002Fh2>\n        <p data-reveal=\"\" data-delay=\"120\" style=\"margin:0 0 40px; max-width:560px; font-size:18px; line-height:1.7; color:#fff\">You've tried talk therapy. You've read the books. You understand your trauma intellectually, but your body hasn't gotten the message that you're safe now. That's because trauma isn't just a memory — <em style=\"font-style:normal; color:#F7C6E2\">it lives in your nervous system<\u002Fem>. And healing it requires a different approach.<\u002Fp>\n        <a data-reveal=\"\" data-delay=\"240\" href=\"#contact\" style=\"display:inline-flex; align-items:center; padding:16px 28px; border-radius:999px; background:#fff; color:#92205C; font-weight:700; font-size:16px; transition:background .3s\" style-hover=\"background:#FBEAF3; color:#92205C\">Book a free 15-minute consultation<\u002Fa>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"200\" style=\"position:relative; justify-self:center; width:min(100%,440px)\">\n        <div style=\"position:absolute; inset:24px -24px -24px 24px; border-radius:28px; background:rgba(255,255,255,.12)\"><\u002Fdiv>\n        <div style=\"position:relative; aspect-ratio:4/5; border-radius:24px; overflow:hidden; box-shadow:0 2px 12px rgba(59,15,48,.2)\">\n          <image-slot id=\"talk-therapy-image\" shape=\"rect\" placeholder=\"Calm, still image — a woman resting, hand on chest, or Elyce's therapy room\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 HOW I HELP — sticky scrollytelling -->\n  <section id=\"how\" data-screen-label=\"04 How I help\" style=\"padding:clamp(80px,12vh,140px) clamp(20px,5vw,64px)\">\n    <div style=\"max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:clamp(40px,6vw,96px); align-items:start\">\n      <div data-sticky-col=\"\" style=\"position:sticky; top:120px; align-self:start\">\n        <p data-reveal=\"\" style=\"margin:0 0 20px; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#D15AA3\">How I help<\u002Fp>\n        <h2 data-reveal=\"\" style=\"margin:0 0 20px; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,3.6vw,46px); line-height:1.12; color:#92205C\">My three-pillar approach to trauma healing<\u002Fh2>\n        <p data-reveal=\"\" data-delay=\"100\" style=\"margin:0 0 40px; max-width:440px; font-size:18px; line-height:1.65\">Three things have to happen for trauma to actually lift. We work on all three.<\u002Fp>\n        <ol ref=\"{{ pillarNavRef }}\" data-hide-mobile=\"\" style=\"list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px\">\n          <li style=\"display:flex; align-items:center; gap:14px; font-size:14px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#C9C9C8; transition:color .5s\"><span style=\"width:28px; height:1px; background:currentColor; display:inline-block\"><\u002Fspan>Nervous system regulation<\u002Fli>\n          <li style=\"display:flex; align-items:center; gap:14px; font-size:14px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#C9C9C8; transition:color .5s\"><span style=\"width:28px; height:1px; background:currentColor; display:inline-block\"><\u002Fspan>Internal Family Systems<\u002Fli>\n          <li style=\"display:flex; align-items:center; gap:14px; font-size:14px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#C9C9C8; transition:color .5s\"><span style=\"width:28px; height:1px; background:currentColor; display:inline-block\"><\u002Fspan>Holistic trauma healing<\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n      <div ref=\"{{ pillarsRef }}\" style=\"display:flex; flex-direction:column; gap:clamp(48px,8vh,96px)\">\n        <article data-pillar=\"\" data-reveal=\"\" style=\"background:#FBEAF3; border-radius:24px; padding:clamp(28px,4vw,48px)\">\n          <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:24px\">\n            <span style=\"width:44px; height:44px; border-radius:50%; background:#D15AA3; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:22px; font-weight:600; flex:none\">1<\u002Fspan>\n            <span style=\"font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#AA2167\">Nervous system regulation<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin:0 0 14px; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,2.6vw,34px); line-height:1.18; color:#92205C\">Restore safety in your body<\u002Fh3>\n          <p style=\"margin:0 0 22px; font-family:'Fraunces',serif; font-style:italic; font-size:20px; line-height:1.45; color:#AA2167\"><span style=\"font-style:normal; font-family:'Karla',sans-serif; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#D15AA3; margin-right:10px\">In plain terms<\u002Fspan>we teach your body that the danger has passed.<\u002Fp>\n          <p style=\"margin:0; font-size:17px; line-height:1.7\">Your nervous system holds the memory of your trauma. Through polyvagal-informed therapy and somatic experiencing, we'll help your body finally recognize that the threat is over. You'll learn to regulate your emotions, calm your stress response, and feel grounded in your own skin.<\u002Fp>\n          <div style=\"margin-top:28px; padding:24px; background:#fff; border-radius:18px\">\n            <p style=\"margin:0 0 16px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#D15AA3\">Your nervous system, 1–10<\u002Fp>\n            <div style=\"position:relative; height:14px; border-radius:999px; background:linear-gradient(90deg,#7EA88F 0%,#C8A25D 25%,#D07899 50%,#B13A72 75%,#6E2352 100%)\">\n              <span style=\"position:absolute; left:70%; top:50%; width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid #92205C; transform:translate(-50%,-50%); box-shadow:0 2px 8px rgba(59,15,48,.2)\"><\u002Fspan>\n              <span style=\"position:absolute; left:12%; top:50%; width:22px; height:22px; border-radius:50%; background:#fff; border:3px dashed #D15AA3; transform:translate(-50%,-50%)\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(52px,1fr)); gap:6px; margin-top:12px; font-size:11px; line-height:1.35; color:#6A696F\">\n              <span><strong style=\"display:block; color:#3F6B52; font-weight:700\">1–2<\u002Fstrong>Steady<\u002Fspan>\n              <span><strong style=\"display:block; color:#7A5C26; font-weight:700\">3–4<\u002Fstrong>Keyed up<\u002Fspan>\n              <span><strong style=\"display:block; color:#B13A72; font-weight:700\">5–6<\u002Fstrong>Looping<\u002Fspan>\n              <span><strong style=\"display:block; color:#92205C; font-weight:700\">7–8<\u002Fstrong>Bracing<\u002Fspan>\n              <span><strong style=\"display:block; color:#6E2352; font-weight:700\">9–10<\u002Fstrong>Flooded<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:16px; font-size:13px; color:#6A696F\">\n              <span style=\"display:inline-flex; align-items:center; gap:8px\"><span style=\"width:12px; height:12px; border-radius:50%; border:3px solid #92205C; display:inline-block\"><\u002Fspan>Where most of my clients live<\u002Fspan>\n              <span style=\"display:inline-flex; align-items:center; gap:8px\"><span style=\"width:12px; height:12px; border-radius:50%; border:3px dashed #D15AA3; display:inline-block\"><\u002Fspan>Where we're headed<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"#nervous-system\" style=\"display:inline-block; margin-top:22px; font-size:15px; font-weight:700; color:#AA2167; border-bottom:1px solid #F3DCE9; padding-bottom:2px\" style-hover=\"color:#92205C; border-bottom-color:#D15AA3\">Learn more about nervous system regulation →<\u002Fa>\n        <\u002Farticle>\n        <article data-pillar=\"\" data-reveal=\"\" style=\"background:#FBEAF3; border-radius:24px; padding:clamp(28px,4vw,48px)\">\n          <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:24px\">\n            <span style=\"width:44px; height:44px; border-radius:50%; background:#B13A72; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:22px; font-weight:600; flex:none\">2<\u002Fspan>\n            <span style=\"font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#AA2167\">Internal Family Systems (IFS)<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin:0 0 14px; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,2.6vw,34px); line-height:1.18; color:#92205C\">Heal the parts of you still living in the past<\u002Fh3>\n          <p style=\"margin:0 0 22px; font-family:'Fraunces',serif; font-style:italic; font-size:20px; line-height:1.45; color:#AA2167\"><span style=\"font-style:normal; font-family:'Karla',sans-serif; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#D15AA3; margin-right:10px\">In plain terms<\u002Fspan>we get to know the inner critic and the people-pleaser instead of fighting them.<\u002Fp>\n          <p style=\"margin:0; font-size:17px; line-height:1.7\">IFS helps you understand the different parts of yourself — the inner critic, the people-pleaser, the anxious protector. We'll compassionately work with these parts to unburden them from old pain, so you can reconnect with your authentic Self and stop operating from survival mode.<\u002Fp>\n          <div style=\"margin-top:28px; padding:24px; background:#fff; border-radius:18px; position:relative; overflow:hidden\">\n            <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 400 400\" style=\"position:absolute; left:50%; top:50%; width:min(100%,360px); height:auto; transform:translate(-50%,-50%); pointer-events:none\">\n              <circle cx=\"200\" cy=\"200\" r=\"70\" fill=\"none\" stroke=\"#F3DCE9\" stroke-width=\"1.4\"><\u002Fcircle>\n              <circle cx=\"200\" cy=\"200\" r=\"120\" fill=\"none\" stroke=\"#F3DCE9\" stroke-width=\"1.4\"><\u002Fcircle>\n              <circle cx=\"200\" cy=\"200\" r=\"170\" fill=\"none\" stroke=\"#F3DCE9\" stroke-width=\"1.4\"><\u002Fcircle>\n            <\u002Fsvg>\n            <p style=\"position:relative; margin:0 0 16px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#D15AA3\">The parts, and the Self underneath<\u002Fp>\n            <div data-parts-grid=\"\" style=\"position:relative; display:grid; grid-template-columns:1fr auto 1fr; grid-template-rows:auto auto auto; gap:14px 10px; align-items:center; justify-items:center\">\n              <span style=\"grid-column:1; grid-row:1; padding:9px 14px; border-radius:999px; background:#FBEAF3; color:#92205C; font-size:13px; font-weight:700; text-align:center\">Inner critic<\u002Fspan>\n              <span data-parts-p2=\"\" style=\"grid-column:3; grid-row:1; padding:9px 14px; border-radius:999px; background:#FBEAF3; color:#92205C; font-size:13px; font-weight:700; text-align:center\">People-pleaser<\u002Fspan>\n              <span data-parts-self=\"\" style=\"grid-column:2; grid-row:2; width:96px; height:96px; border-radius:50%; background:#D15AA3; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:22px; box-shadow:0 6px 18px rgba(209,90,163,.35)\">Self<\u002Fspan>\n              <span data-parts-p3=\"\" style=\"grid-column:1; grid-row:3; padding:9px 14px; border-radius:999px; background:#FBEAF3; color:#92205C; font-size:13px; font-weight:700; text-align:center\">Anxious protector<\u002Fspan>\n              <span data-parts-p4=\"\" style=\"grid-column:3; grid-row:3; padding:9px 14px; border-radius:999px; background:#FBEAF3; color:#92205C; font-size:13px; font-weight:700; text-align:center\">The one holding it together<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"position:relative; margin:18px 0 0; text-align:center; font-size:13px; color:#6A696F\">Every part is trying to protect you. None of them is the enemy.<\u002Fp>\n          <\u002Fdiv>\n          <a href=\"#ifs\" style=\"display:inline-block; margin-top:22px; font-size:15px; font-weight:700; color:#AA2167; border-bottom:1px solid #F3DCE9; padding-bottom:2px\" style-hover=\"color:#92205C; border-bottom-color:#D15AA3\">Learn more about IFS →<\u002Fa>\n        <\u002Farticle>\n        <article data-pillar=\"\" data-reveal=\"\" style=\"background:#FBEAF3; border-radius:24px; padding:clamp(28px,4vw,48px)\">\n          <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:24px\">\n            <span style=\"width:44px; height:44px; border-radius:50%; background:#92205C; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:22px; font-weight:600; flex:none\">3<\u002Fspan>\n            <span style=\"font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#AA2167\">Holistic trauma healing<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin:0 0 14px; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,2.6vw,34px); line-height:1.18; color:#92205C\">Integrate mind, body, and spirit<\u002Fh3>\n          <p style=\"margin:0 0 22px; font-family:'Fraunces',serif; font-style:italic; font-size:20px; line-height:1.45; color:#AA2167\"><span style=\"font-style:normal; font-family:'Karla',sans-serif; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#D15AA3; margin-right:10px\">In plain terms<\u002Fspan>we use more than talking — sound, breath and movement help release what's stored.<\u002Fp>\n          <p style=\"margin:0; font-size:17px; line-height:1.7\">True healing happens when we address the whole person. In addition to evidence-based therapy, I integrate sound healing, breathwork, mindfulness, and somatic practices to help release trauma stored in your body and reconnect you with a sense of peace and wholeness.<\u002Fp>\n          <div style=\"margin-top:28px; padding:24px; background:#fff; border-radius:18px\">\n            <p style=\"margin:0 0 20px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#D15AA3\">More than talking<\u002Fp>\n            <div style=\"display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:center; gap:6px\">\n              <div style=\"display:flex; flex-direction:column; align-items:center; gap:10px; width:84px; text-align:center\">\n                <span style=\"width:56px; height:56px; border-radius:50%; background:#D15AA3; color:#fff; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px #FBEAF3\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6 L4 18\"><\u002Fpath><path d=\"M8 9 L8 15\"><\u002Fpath><path d=\"M12 4 L12 20\"><\u002Fpath><path d=\"M16 8 L16 16\"><\u002Fpath><path d=\"M20 10 L20 14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <span style=\"font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#92205C\">Talk<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"align-self:center; color:#D15AA3; font-size:18px; margin-top:-22px\">→<\u002Fspan>\n              <div style=\"display:flex; flex-direction:column; align-items:center; gap:10px; width:84px; text-align:center\">\n                <span style=\"width:56px; height:56px; border-radius:50%; background:#D15AA3; color:#fff; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px #FBEAF3\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"> olor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12 C5 7 8 7 11 12 C14 17 17 17 22 12\"><\u002Fpath><path d=\"M2 17 C5 12 8 12 11 17 C14 22 17 22 22 17\" opacity=\".5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <span style=\"font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#92205C\">Movement<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"#holistic\" style=\"display:inline-block; margin-top:22px; font-size:15px; font-weight:700; color:#AA2167; border-bottom:1px solid #F3DCE9; padding-bottom:2px\" style-hover=\"color:#92205C; border-bottom-color:#D15AA3\">Learn more about holistic healing →<\u002Fa>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 PROOF -->\n  <section data-screen-label=\"05 Proof\" style=\"padding:clamp(80px,12vh,140px) clamp(20px,5vw,64px); background:#FBEAF3\">\n    <div style=\"max-width:1180px; margin:0 auto\">\n      <div style=\"text-align:center; margin-bottom:56px\">\n        <p data-reveal=\"\" style=\"margin:0 0 20px; display:inline-flex; align-items:center; gap:12px; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#D15AA3\">What changes<sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:3px 8px; border:1px dashed #D15AA3; border-radius:6px; font-size:10px; letter-spacing:.12em; color:#92205C\">Needs Elyce<\u002Fspan><\u002Fsc-if><\u002Fp>\n        <h2 data-reveal=\"\" style=\"margin:0 auto; max-width:640px; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,3.6vw,46px); line-height:1.15; color:#92205C\">Where the women I work with start — and where they get to<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:24px\">\n        <article data-reveal=\"\" data-delay=\"0\" style=\"background:#fff; border-radius:24px; padding:36px 32px; box-shadow:0 2px 10px rgba(146,32,92,.08); display:flex; flex-direction:column; gap:26px\">\n          <div>\n            <p style=\"margin:0 0 10px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#A7A7A6\">Where she started<\u002Fp>\n            <p style=\"margin:0; font-family:'Fraunces',serif; font-size:22px; line-height:1.4; color:#92205C\">“I could run a department but I couldn't sit still in my own living room.”<\u002Fp>\n            <p style=\"margin:10px 0 0; font-size:14px; color:#A7A7A6\">— A., 8 months<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"height:1px; background:#F3DCE9\"><\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 8px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#A7A7A6\">What the work looked like<\u002Fp>\n            <p style=\"margin:0; font-size:16px; line-height:1.65; font-style:italic\">[One or two sentences naming the approach used — IFS parts work, nervous system regulation.]<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 8px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#A7A7A6\">Where she got to<\u002Fp>\n            <p style=\"margin:0; font-size:16px; line-height:1.65; font-style:italic\">[The concrete change. Not “transformed” — something specific she can now do that she couldn't before.]<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article data-reveal=\"\" data-delay=\"120\" style=\"background:#fff; border-radius:24px; padding:36px 32px; box-shadow:0 2px 10px rgba(146,32,92,.08); display:flex; flex-direction:column; gap:26px\">\n          <div>\n            <p style=\"margin:0 0 10px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#A7A7A6\">Where she started<\u002Fp>\n            <p style=\"margin:0; font-family:'Fraunces line-height:1.65; font-style:italic\">[Approach used.]<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 8px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#A7A7A6\">Where she got to<\u002Fp>\n            <p style=\"margin:0; font-size:16px; line-height:1.65; font-style:italic\">[The concrete change.]<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n      <p data-reveal=\"\" style=\"margin:28px auto 0; max-width:720px; text-align:center; font-size:13px; line-height:1.6; color:#A7A7A6\">Client stories are shared with written permission and all identifying details are changed. Some are composites drawn from common patterns rather than one person.<\u002Fp>\n      <div data-reveal=\"\" style=\"margin-top:64px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:16px\">\n        <div style=\"display:flex; flex-direction:column; gap:8px; padding:24px; border-radius:18px; background:#fff\">\n          <span style=\"font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:#92205C\">IFS Institute Certified Therapist<\u002Fspan>\n          <span style=\"font-size:14px; line-height:1.5\">Trained and certified in Internal Family Systems by the IFS Institute.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:8px; padding:24px; border-radius:18px; background:#fff\">\n          <span style=\"font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:#92205C\">Certified Trauma Professional<\u002Fspan>\n          <span style=\"font-size:14px; line-height:1.5\">Specialist training in complex and childhood trauma.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:8px; padding:24px; border-radius:18px; background:#fff\">\n          <span style=\"font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:#92205C\">Psychology Today data-reveal=\"\" data-delay=\"140\" style=\"margin:0 0 32px; font-size:17px; line-height:1.7\">My approach goes beyond traditional talk therapy. I combine evidence-based methods with holistic healing practices, because true transformation happens when we address trauma at every level — mental, emotional, physical, and spiritual.<\u002Fp>\n        <div data-reveal=\"\" data-delay=\"200\" style=\"padding:28px 32px; border-radius:20px; background:#FBEAF3\">\n          <p style=\"margin:0 0 10px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-family:'Fraunces',serif; font-weight:600; font-size:22px; color:#92205C\">Why “The Feeling Expert”?<sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:3px 8px; border:1px dashed #D15AA3; border-radius:6px; font-family:'Karla',sans-serif; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#92205C\">Elyce to confirm<\u002Fspan><\u002Fsc-if><\u002Fp>\n          <p style=\"margin:0; font-size:17px; line-height:1.7\">Because the women I work with are usually experts at everything except feeling. They can analyse, manage, perform and hold it all together. What they've lost is the ability to feel safe in their own body. That's the part I help you get back.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"260\" style=\"margin-top:28px; display:flex; flex-wrap:wrap; gap:16px 28px; font-size:15px; font-weight:700\">\n          <a href=\"#story\" style=\"color:#AA2167; border-bottom:1px solid #F3DCE9; padding-bottom:2px\" style-hover=\"color:#92205C; border-bottom-color:#D15AA3\">Read my full story →<\u002Fa>\n          <a href=\"#video\" style=\"color:#AA2167; border-bottom:1px solid #F3DCE9; padding-bottom:2px\" style-hover=\"color:#92205C; border-bottom-color:#D15AA3\">Watch the 45-second welcome →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 07 WHAT WORKING TOGETHER LOOKS LIKE -->\n  <section data-screen-label=\"07 What working together looks like\" style=\"padding:clamp(80px,12vh,140px) clamp(20px,5vw,64px); background:#FBEAF3\">\n    <div style=\"max-width:1180px; margin:0 auto\">\n      <div style=\"text-align:center; margin-bottom:64px\">\n        <p data-reveal=\"\" style=\"margin:0 0 20px; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#D15AA3\">What working together looks like<\u002Fp>\n        <h2 data-reveal=\"\" style=\"margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,3.6vw,46px); line-height:1.15; color:#92205C\">Getting started is simple<\u002Fh2>\n      <\u002Fdiv>\n      <ol style=\"list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:24px\">\n        <li data-reveal=\"\" data-delay=\"0\" style=\"display:flex; flex-direction:column; gap:18px; padding:36px 32px; background:#fff; border-radius:24px; box-shadow:0 2px 10px rgba(146,32,92,.08)\">\n          <span style=\"width:52px; height:52px; border-radius:50%; background:#D15AA3; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:24px; font-weight:600\">1<\u002Fspan>\n          <h3 style=\"margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:24px; line-height:1.25; color:#92205C\">Book your free 15-minute consultation<\u002Fh3>\n          <p style=\"margin:0; font-size:16px; line-height:1.65\">We'll talk about what you're experiencing and whether we're a good fit. No pressure, just a conversation.<\u002Fp>\n        <\u002Fli>\n        <li data-reveal=\"\" data-delay=\"120\" style=\"display:flex; flex-direction:column; gap:18px; padding:36px 32px; background:#fff; border-radius:24px; box-shadow:0 2px 10px rgba(146,32,92,.08)\">\n          <span style=\"width:52px; height:52px; border-radius:50%; background:#B13A72; color:#fff; display:inline-flex; align-it      <h3 style=\"margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:24px; line-height:1.25; color:#92205C\">7 Steps to Overcoming Your Limiting Beliefs<\u002Fh3>\n          <p style=\"margin:0; font-size:16px; line-height:1.65; flex:1\">A free guide to recognising the beliefs holding you back, and reframing them.<\u002Fp>\n          <span style=\"font-size:15px; font-weight:700; color:#92205C; padding-bottom:28px\">Free · sent by email →<\u002Fspan>\n          <span style=\"height:6px; margin:0 -32px; background:#D15AA3\"><\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 LATEST WRITING -->\n  <section id=\"writing\" data-screen-label=\"10 Latest writing\" style=\"padding:clamp(80px,12vh,140px) clamp(20px,5vw,64px)\">\n    <div style=\"max-width:1180px; margin:0 auto\">\n      <div data-reveal=\"\" style=\"display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:48px\">\n        <div>\n          <p style=\"margin:0 0 20px; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#D15AA3\">Latest writing<\u002Fp>\n          <h2 style=\"margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,3.6vw,46px); line-height:1.12; color:#92205C\">Writing from the practice<\u002Fh2>\n        <\u002Fdiv>\n        <a href=\"#blog\" style=\"font-size:15px; font-weight:700; color:#AA2167; border-bottom:1px solid #F3DCE9; padding-bottom:2px\" style-hover=\"color:#92205C; border-bottom-color:#D15AA3\">Read everything →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:0 40px; border-top:1px solid #F3DCE9\">\n        <sc-for list=\"{{ posts }}\" as=\"post\" hint-placeholder-count=\"3\">\n          <a data-reveal=\"\" href=\"{{ post.href }}\" style=\"display:flex; flex-direction:column; gap:14px; padding:32px 0; border-bottom:1px solid #F3DCE9; color:inherit\" style-hover=\"color:inherit\">\n            <span style=\"font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#A7A7A6\">{{ post.date }} · {{ post.read }}<\u002Fspan>\n            <h3 style=\"margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:24px; line-height:1.3; color:#92205C\">{{ post.title }}<\u002Fh3>\n            <span style=\"font-size:15px; font-weight:700; color:#AA2167\">Read →<\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11 CLOSE & CRISIS NOTE -->\n  <section id=\"contact\" data-screen-label=\"11 Close &amp; crisis note\" style=\"position:relative; padding:clamp(100px,16vh,180px) clamp(20px,5vw,64px) clamp(80px,12vh,120px); overflow:hidden; background:#FBEAF3\">\n    <div aria-hidden=\"true\" style=\"position:absolute; inset:0; background:radial-gradient(circle at 10% 10%, rgba(209,90,163,.22) 0%, rgba(209,90,163,.08) 35%, rgba(209,90,163,0) 65%); pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative; max-width:820px; margin:0 auto; text-align:center\">\n      <h2 data-reveal=\"\" style=\"margin:0 0 32px; font-family:'Fraunces',serif; font-weight:500; font-size:clamp(44px,7vw,92px); line-height:1; letter-spacing:-.02em; color:#92205C\">Ready when <em style=\"color:#D15AA3\">you<\u002Fem> are.<\u002Fh2>\n      <p data-reveal=\"\" data-delay=\"100\" style=\"margin:0 auto 20px; max-width:620px; font-size:19px; line-height:1.7\">You've carried this a long time. Fifteen minutes on the phone costs you nothing and tells you whether I'm the right person to help you put it down.<\u002Fp>\n      <p data-reveal=\"\" data-delay=\"160\" style=\"margin:0 auto 44px; max-width:620px; font-size:19px; line-height:1.7\"><strong style=\"font-weight:700; color:#92205C\">And if I'm not<\u002Fstrong> — if what you need is outside what I do — I'll say so on that call and point you toward someone better suited. You won't leave that conversation with nowhere to go.<\u002Fp>\n      <div data-reveal=\"\" data-delay=\"240\" style=\"display:flex; flex-direction:column; align-items:center; gap:18px\">\n        <a href=\"#book\" style=\"display:inline-flex; align-items:center; padding:18px 32px; border-radius:999px; background:#D15AA3; color:#fff; font-weight:700; font-size:17px; transition:background .3s, transform .3s\" style-hover=\"background:#92205C; color:#fff; transform:translateY(-1px)\">Book a free 15-minute consultation<\u002Fa>\n        <span style=\"font-size:15px\">Or call <a href=\"tel:+18442264325\" style=\"font-weight:700; color:#AA2167\">(844) 226-4325<\u002Fa> — that's (844) CAN-HEAL<\u002Fspan>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"320\" style=\"margin:72px auto 0; max-width:620px; padding:28px 32px; border-radius:20px; background:#fff; box-shadow:0 2px 10px rgba(146,32,92,.08); text-align:left; font-size:15px; line-height:1.7\">\n        <p style=\"margin:0 0 8px\"><strong style=\"font-weight:700; color:#92205C\">If you're in crisis right now<\u002Fstrong>, please don't wait for an appointment. Call or text <strong style=\"font-weight:700; color:#92205C\">988<\u002Fstrong> for the Suicide &amp; Crisis Lifeline, or call <strong style=\"font-weight:700; color:#92205C\">911<\u002Fstrong> if you're in immediate danger.<\u002Fp>\n        <p style=\"margin:0; color:#A7A7A6\">This practice isn't a crisis service. I reply to messages during office hours, Monday to Friday.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid #F3DCE9; padding:48px clamp(20px,5vw,64px) 40px\">\n    <div style=\"max-width:1180px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:24px\">\n      <p style=\"margin:0; font-family:'Fraunces',serif; font-style:italic; font-size:22px; color:#AA2167\">Be Seen. Be heard. Be you.<\u002Fp>\n      <nav style=\"display:flex; flex-wrap:wrap; gap:24px; font-size:13px; font-weight:500\">\n        <a href=\"#how\" style=\"color:#6A696F\" style-hover=\"color:#92205C\">How I help<\u002Fa>\n        <a href=\"#about\" style=\"color:#6A696F\" style-hover=\"color:#92205C\">About<\u002Fa>\n        <a href=\"#fees\" style=\"color:#6A696F\" style-hover=\"color:#92205C\">Fees<\u002Fa>\n        <a href=\"#writing\" style=\"color:#6A696F\" style-hover=\"color:#92205C\">Writing<\u002Fa>\n        <a href=\"#contact\" style=\"color:#6A696F\" style-hover=\"color:#92205C\">Contact<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"max-width:1180px; margin:32px auto 0; display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 24px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#A7A7A6\">\n      <span>© 2026 The Feeling Expert® · Boca Raton, FL<\u002Fspan>\n      <span>@thefeelingexpert<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;portrait&quot;,&quot;text-only&quot;],&quot;default&quot;:&quot;portrait&quot;,&quot;tsType&quot;:&quot;'portrait' | 'text-only'&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Build notes&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  rootRef = React.createRef();\n  progressRef = React.createRef();\n  pillarsRef = React.createRef();\n  pillarNavRef = React.createRef();\n\n  state = { menuOpen: false };\n  renderVals() {\n    return {\n      menuOpen: this.state.menuOpen,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      rootRef: this.rootRef,\n      progressRef: this.progressRef,\n      pillarsRef: this.pillarsRef,\n      pillarNavRef: this.pillarNavRef,\n      showPortrait: (this.props.heroLayout ?? 'portrait') === 'portrait',\n      showNotes: this.props.showNotes ?? true,\n      posts: [\n        { title: '[Most recent post title — pulled automatically]', date: 'Sep 2026', read: '6 min read', href: '#post-1' },\n        { title: '[Second most recent post title]', date: 'Aug 2026', read: '4 min read', href: '#post-2' },\n        { title: '[Third most recent post title]', date: 'Aug 2026', read: '5 min read', href: '#post-3' }\n      ]\n    };\n  }\n\n  componentDidMount() {\n    this.setupReveal();\n    this.onScroll = () => {\n      const el = this.progressRef.current; if (!el) return;\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      el.style.width = (max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0) + '%';\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n  }\n  componentDidUpdate() { this.setupReveal(); }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    this.io?.disconnect(); this.pio?.disconnect();\n  }\n\n  setupReveal() {\n    const root = this.rootRef.current; if (!root) return;\n    const motion = this.props.motion ?? true;\n    if (!this.io) {\n      this.io = new IntersectionObserver((entries) => {\n        for (const e of entries) {\n          if (!e.isIntersecting) continue;\n          const el = e.target, d = +(el.dataset.delay || 0);\n          setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'none'; }, d);\n          this.io.unobserve(el);\n        }\n      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    }\n    root.querySelectorAll('[data-reveal]:not([data-reveal-ready])').forEach((el) => {\n      el.setAttribute('data-reveal-ready', '');\n      if (!motion) return;\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(24px)';\n      el.style.transition = 'opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1)';\n      this.io.observe(el);\n    });\n    // sticky pillar nav highlight\n    const pillars = this.pillarsRef.current, nav = this.pillarNavRef.current;\n    if (pillars && nav && !this.pio) {\n      const items = [...pillars.querySelectorAll('[data-pillar]')];\n      const lis = [...nav.children];\n      this.pio = new IntersectionObserver((entries) => {\n        for (const e of entries) {\n          if (!e.isIntersecting) continue;\n          const i = items.indexOf(e.target);\n          lis.forEach((li, j) => { li.style.color = j === i ? '#92205C' : '#C9C9C8'; });\n        }\n      }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });\n      items.forEach((p) => this.pio.observe(p));\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
